# Application bindings
$terminal = uwsm app -- $TERMINAL
$browser = omarchy-launch-browser

unbind = SUPER, F
unbind = SUPER, J
unbind = SUPER, K
bindd = SUPER, return, Terminal, exec, $terminal --working-directory="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER, F, File manager, exec, uwsm app -- nautilus --new-window
bindd = SUPER, B, Browser, exec, $browser
bindd = SUPER SHIFT, B, Browser (private), exec, $browser --private
bindd = SUPER, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER, N, Editor, exec, omarchy-launch-editor
bindd = SUPER, slash, Passwords, exec, uwsm app -- 1password
bindd = CTRL ALT, O, Smart screenshot, exec, ~/.config/hypr/scripts/screenshot-smart.sh

# If your web app url contains #, type it as ## to prevent hyperland treat it as comments
# bindd = SUPER, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
# bindd = SUPER SHIFT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
# bindd = SUPER, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
# bindd = SUPER, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
# bindd = SUPER, Y, YouTube, exec, omarchy-launch-or-focus-webapp YouTube "https://youtube.com/"
# bindd = SUPER SHIFT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
# bindd = SUPER ALT, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
# bindd = SUPER, X, X, exec, omarchy-launch-webapp "https://x.com/"
# bindd = SUPER SHIFT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

# Vim-style focus movement (override default arrow keys)
bindd = SUPER, H, Move focus left, movefocus, l
bindd = SUPER, L, Move focus right, movefocus, r
bindd = SUPER, K, Move focus up, movefocus, u
bindd = SUPER, J, Move focus down, movefocus, d

# Vim-style window swapping
bindd = SUPER SHIFT, H, Swap window to the left, swapwindow, l
bindd = SUPER SHIFT, L, Swap window to the right, swapwindow, r
bindd = SUPER SHIFT, K, Swap window up, swapwindow, u
bindd = SUPER SHIFT, J, Swap window down, swapwindow, d

# Vim-style window resizing (SUPER+CTRL to avoid conflict with group movement)
bindde = SUPER CTRL, H, Resize window left, resizeactive, -40 0
bindde = SUPER CTRL, L, Resize window right, resizeactive, 40 0
bindde = SUPER CTRL, K, Resize window up, resizeactive, 0 -40
bindde = SUPER CTRL, J, Resize window down, resizeactive, 0 40

# Toggle split
bindd = SUPER, A, Toggle split, togglesplit

# Scratchpad
unbind = SUPER ALT, S
bindd = SUPER SHIFT, S, Move window to scratchpad, movetoworkspacesilent, special:scratchpad

# Close window
unbind = SUPER, W
bindd = SUPER, Q, Close window, killactive

# Numpad workspace switching (no modifier needed)
bindd = , KP_End, Switch to workspace 1, workspace, 1
bindd = , KP_Down, Switch to workspace 2, workspace, 2
bindd = , KP_Next, Switch to workspace 3, workspace, 3
bindd = , KP_Left, Switch to workspace 4, workspace, 4
bindd = , KP_Begin, Switch to workspace 5, workspace, 5
bindd = , KP_Right, Switch to workspace 6, workspace, 6
bindd = , KP_Home, Switch to workspace 7, workspace, 7
bindd = , KP_Up, Switch to workspace 8, workspace, 8
bindd = , KP_Prior, Switch to workspace 9, workspace, 9

# Numpad: Move window to workspace (SUPER+SHIFT)
bindd = SUPER SHIFT, KP_End, Move window to workspace 1, movetoworkspace, 1
bindd = SUPER SHIFT, KP_Down, Move window to workspace 2, movetoworkspace, 2
bindd = SUPER SHIFT, KP_Next, Move window to workspace 3, movetoworkspace, 3
bindd = SUPER SHIFT, KP_Left, Move window to workspace 4, movetoworkspace, 4
bindd = SUPER SHIFT, KP_Begin, Move window to workspace 5, movetoworkspace, 5
bindd = SUPER SHIFT, KP_Right, Move window to workspace 6, movetoworkspace, 6
bindd = SUPER SHIFT, KP_Home, Move window to workspace 7, movetoworkspace, 7
bindd = SUPER SHIFT, KP_Up, Move window to workspace 8, movetoworkspace, 8
bindd = SUPER SHIFT, KP_Prior, Move window to workspace 9, movetoworkspace, 9

# Numpad: Move window to workspace silently (SUPER+ALT)
bindd = SUPER ALT, KP_End, Move window silently to workspace 1, movetoworkspacesilent, 1
bindd = SUPER ALT, KP_Down, Move window silently to workspace 2, movetoworkspacesilent, 2
bindd = SUPER ALT, KP_Next, Move window silently to workspace 3, movetoworkspacesilent, 3
bindd = SUPER ALT, KP_Left, Move window silently to workspace 4, movetoworkspacesilent, 4
bindd = SUPER ALT, KP_Begin, Move window silently to workspace 5, movetoworkspacesilent, 5
bindd = SUPER ALT, KP_Right, Move window silently to workspace 6, movetoworkspacesilent, 6
bindd = SUPER ALT, KP_Home, Move window silently to workspace 7, movetoworkspacesilent, 7
bindd = SUPER ALT, KP_Up, Move window silently to workspace 8, movetoworkspacesilent, 8
bindd = SUPER ALT, KP_Prior, Move window silently to workspace 9, movetoworkspacesilent, 9

# Regular numbers: Move window to workspace silently (SUPER+ALT)
bindd = SUPER ALT, code:10, Move window silently to workspace 1, movetoworkspacesilent, 1
bindd = SUPER ALT, code:11, Move window silently to workspace 2, movetoworkspacesilent, 2
bindd = SUPER ALT, code:12, Move window silently to workspace 3, movetoworkspacesilent, 3
bindd = SUPER ALT, code:13, Move window silently to workspace 4, movetoworkspacesilent, 4
bindd = SUPER ALT, code:14, Move window silently to workspace 5, movetoworkspacesilent, 5
bindd = SUPER ALT, code:15, Move window silently to workspace 6, movetoworkspacesilent, 6
bindd = SUPER ALT, code:16, Move window silently to workspace 7, movetoworkspacesilent, 7
bindd = SUPER ALT, code:17, Move window silently to workspace 8, movetoworkspacesilent, 8
bindd = SUPER ALT, code:18, Move window silently to workspace 9, movetoworkspacesilent, 9

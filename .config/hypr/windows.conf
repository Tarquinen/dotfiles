# Override default transparency
windowrule = opacity 1.0 1.0, class:.*

# Remove tile forcing for Chrome (allows normal split behavior)
windowrule = unset, tag:chromium-based-browser

# Stremio fullscreen fix
windowrulev2 = fullscreen, class:^(com.stremio.Stremio)$, title:^(Stremio)$
windowrulev2 = float, class:^(com.stremio.Stremio)$

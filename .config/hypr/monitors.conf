# See https://wiki.hyprland.org/Configuring/Monitors/
# You must relaunch Hyprland after changing any envs (use Super+Esc, then Relaunch)

# Set 1x scaling for standard resolution monitors
env = GDK_SCALE,1

# --- Monitor Setup ---

# AOC Q27G40XMN (DP-2, serial: ...473) - 27-inch 1440p at 180Hz (LEFT monitor)
monitor = DP-2, 2560x1440@180, 0x0, 1, vrr, 0

# AOC Q27G40XMN (DP-3, serial: ...468) - 27-inch 1440p at 180Hz (CENTER monitor)
monitor = DP-3, 2560x1440@180, 2560x0, 1, vrr, 0

# AOC Q27G40XMN (DP-1, serial: ...469) - 27-inch 1440p at 180Hz (RIGHT monitor)
monitor = DP-1, 2560x1440@180, 5120x0, 1, vrr, 0

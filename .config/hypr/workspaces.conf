# ~/.config/hypr/workspaces.conf
#
# Binds 9 workspaces across three monitors for a predictable setup.

# Left Monitor (DP-2)
workspace = 1, monitor:DP-2, persistent:true, default:true
workspace = 2, monitor:DP-2, persistent:true
workspace = 3, monitor:DP-2, persistent:true

# Center Monitor (DP-3)
workspace = 4, monitor:DP-3, persistent:true, default:true
workspace = 5, monitor:DP-3, persistent:true
workspace = 6, monitor:DP-3, persistent:true

# Right Monitor (DP-1)
workspace = 7, monitor:DP-1, persistent:true, default:true
workspace = 8, monitor:DP-1, persistent:true
workspace = 9, monitor:DP-1, persistent:true
